name: PER-30 Playwright evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/prepare-playwright-fixture.mjs
      - name: Build dashboard image
        run: docker build --tag per-30-dashboard:${{ github.sha }} .
      - name: Start dashboard server
        run: docker run --detach --name per-30-dashboard --publish 4173:3000 per-30-dashboard:${{ github.sha }}
      - run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:4173/health
      - name: Run Playwright and write metadata
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: true
          PLAYWRIGHT_COMMAND: npm run test:e2e
        run: |
          node scripts/write-playwright-metadata.mjs pending
          set +e
          npm run test:e2e
          status=$?
          node scripts/write-playwright-metadata.mjs "$status"
          exit "$status"
      - if: always()
        name: Collect server logs
        run: docker logs per-30-dashboard > playwright-artifacts/server.log 2>&1 || true
      - if: always()
        name: Stop dashboard server
        run: docker rm --force per-30-dashboard || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PER-30-playwright-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            playwright-artifacts/
          if-no-files-found: warn
          retention-days: 14
