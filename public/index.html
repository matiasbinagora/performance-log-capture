<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Catalog</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f5f7fb; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 64px; }
      header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 28px; }
      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 8px; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -0.05em; }
      .intro { max-width: 560px; color: #58657a; line-height: 1.6; }
      .health { color: #23663d; font-size: .9rem; white-space: nowrap; }
      .search { display: flex; gap: 10px; margin-bottom: 28px; }
      input { flex: 1; min-width: 0; border: 1px solid #cad2df; border-radius: 12px; padding: 14px 16px; font: inherit; background: white; }
      button { border: 0; border-radius: 12px; padding: 0 20px; font: inherit; font-weight: 700; color: white; background: #3157d5; cursor: pointer; }
      button:hover { background: #2447bc; }
      button:focus-visible, input:focus-visible { outline: 3px solid #a9bbff; outline-offset: 2px; }
      .status { min-height: 28px; margin-bottom: 16px; color: #58657a; }
      .status.error { border: 1px solid #f2b8b5; border-radius: 12px; padding: 14px 16px; color: #9d2d2a; background: #fff5f4; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
      .card, .detail { border: 1px solid #e1e6ef; border-radius: 16px; padding: 20px; background: white; box-shadow: 0 8px 24px rgba(36, 52, 89, .06); }
      .card { display: flex; flex-direction: column; gap: 12px; }
      .card h2, .detail h2 { margin-bottom: 0; font-size: 1.15rem; }
      .card p, .detail p { color: #58657a; line-height: 1.5; }
      .category { color: #3157d5; font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      .price { margin-top: auto; font-size: 1.2rem; font-weight: 800; }
      .card button { align-self: start; padding: 10px 14px; }
      .detail { margin-top: 28px; }
      .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; margin: 20px 0 0; }
      dt { color: #58657a; }
      dd { margin: 0; font-weight: 700; }
      .back { margin-bottom: 16px; color: #3157d5; background: transparent; padding: 0; }
      .back:hover { color: #2447bc; background: transparent; }
      [hidden] { display: none !important; }
      @media (max-width: 600px) { header { display: block; } .health { display: block; margin-top: 12px; } .search { flex-direction: column; } button { min-height: 48px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Local Catalog</h1>
          <p class="intro">Search a small, deterministic product collection and open any item for its full details.</p>
        </div>
        <span class="health" aria-label="Application status">Local application · ready</span>
      </header>
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search-input">Search products</label>
        <input id="search-input" name="q" type="search" placeholder="Try “desk” or “office”" autocomplete="off" required />
        <button type="submit">Search</button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite">Enter a term to search the catalog.</p>
      <section class="grid" id="results" aria-label="Search results"></section>
      <section class="detail" id="detail" aria-live="polite" hidden></section>
    </main>
    <script>
      const form = document.querySelector('#search-form');
      const input = document.querySelector('#search-input');
      const status = document.querySelector('#status');
      const results = document.querySelector('#results');
      const detail = document.querySelector('#detail');
      form.addEventListener('submit', (event) => { event.preventDefault(); searchProducts(input.value); });
      results.addEventListener('click', (event) => { const button = event.target.closest('[data-product-id]'); if (button) showProduct(button.dataset.productId); });
      detail.addEventListener('click', (event) => { if (event.target.closest('[data-action="back"]')) showResults(); });

      async function searchProducts(term) {
        setLoading('Searching the catalog…');
        try {
          const response = await fetch(`/products/search?q=${encodeURIComponent(term)}`);
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error?.message || 'Search failed.');
          renderResults(payload.products, payload.query);
          setStatus(payload.count ? `${payload.count} result${payload.count === 1 ? '' : 's'} found.` : 'No products matched that search.');
        } catch (error) { renderResults([]); setError(error.message || 'Search failed.'); }
      }

      async function showProduct(id) {
        setLoading('Loading product details…'); results.hidden = true; detail.hidden = false;
        try {
          const response = await fetch(`/products/${encodeURIComponent(id)}`);
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error?.message || 'Product could not be loaded.');
          detail.innerHTML = `<button class="back" data-action="back" type="button">← Back to results</button>${productMarkup(payload.product, true)}`;
          setStatus('Product details loaded.');
        } catch (error) { detail.innerHTML = ''; setError(error.message || 'Product could not be loaded.'); }
      }

      function renderResults(items, query) {
        detail.hidden = true; results.hidden = false;
        results.innerHTML = items.map((product) => `<article class="card">${productMarkup(product)}<button data-product-id="${product.id}" type="button">View details</button></article>`).join('');
        if (query) input.value = query;
      }
      function productMarkup(product, full) { return `<span class="category">${product.category}</span><h2>${product.name}</h2><p>${product.description}</p><span class="price">${formatPrice(product.price.amount, product.price.currency)}</span>${full ? `<dl><dt>Product ID</dt><dd>${product.id}</dd><dt>Tags</dt><dd>${product.tags.join(', ')}</dd></dl>` : ''}`; }
      function showResults() { detail.hidden = true; results.hidden = false; setStatus('Choose a product to view its details.'); }
      function setLoading(message) { status.className = 'status'; status.textContent = message; }
      function setStatus(message) { status.className = 'status'; status.textContent = message; }
      function setError(message) { status.className = 'status error'; status.textContent = message; }
      function formatPrice(amount, currency) { return new Intl.NumberFormat('en-US', { style: 'currency', currency }).format(amount); }
    </script>
  </body>
</html>
